<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>一年级奥数选择题练习</title>
  <style>
    :root {
      --bg: #f7fbf8;
      --panel: #ffffff;
      --ink: #1c2a24;
      --muted: #60706a;
      --line: #dce7e1;
      --green: #278052;
      --green-soft: #e6f5ed;
      --red: #c84a45;
      --red-soft: #fde9e8;
      --blue: #2f69a8;
      --blue-soft: #e7f0fa;
      --yellow: #ffd166;
      --shadow: 0 18px 45px rgba(46, 75, 62, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(255, 209, 102, 0.28), transparent 32rem),
        linear-gradient(135deg, #f8fcff 0%, var(--bg) 48%, #fff8e7 100%);
    }

    button {
      font: inherit;
    }

    .app {
      width: min(1160px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 40px;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 20px;
      align-items: end;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 4vw, 46px);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
    }

    .score-card {
      min-width: 220px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: var(--shadow);
    }

    .score-label {
      color: var(--muted);
      font-size: 14px;
    }

    .score-number {
      margin-top: 4px;
      font-size: 34px;
      font-weight: 800;
    }

    .progress-track {
      height: 10px;
      margin-top: 12px;
      overflow: hidden;
      border-radius: 999px;
      background: #edf3ef;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--green), var(--yellow));
      transition: width 180ms ease;
    }

    .layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 18px;
      align-items: start;
    }

    .side {
      position: sticky;
      top: 16px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: var(--shadow);
    }

    .side h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .legend {
      display: grid;
      gap: 10px;
      margin-bottom: 16px;
      color: var(--muted);
      font-size: 14px;
    }

    .legend span {
      display: inline-flex;
      gap: 8px;
      align-items: center;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: #fff;
    }

    .dot.answered {
      border-color: var(--blue);
      background: var(--blue);
    }

    .dot.correct {
      border-color: var(--green);
      background: var(--green);
    }

    .question-map {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .jump {
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: #fff;
      cursor: pointer;
      transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
    }

    .jump:hover {
      transform: translateY(-1px);
      border-color: var(--blue);
    }

    .jump.answered {
      color: #17446f;
      border-color: #aac7e8;
      background: var(--blue-soft);
    }

    .jump.correct {
      color: #135438;
      border-color: #9bd2b7;
      background: var(--green-soft);
    }

    .jump.wrong {
      color: #8f2c28;
      border-color: #efb4b1;
      background: var(--red-soft);
    }

    .actions {
      display: grid;
      gap: 10px;
      margin-top: 16px;
    }

    .primary,
    .secondary {
      min-height: 44px;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 120ms ease, opacity 120ms ease;
    }

    .primary {
      border: 0;
      color: #fff;
      background: var(--green);
      font-weight: 700;
    }

    .secondary {
      border: 1px solid var(--line);
      color: var(--ink);
      background: #fff;
    }

    .primary:hover,
    .secondary:hover {
      transform: translateY(-1px);
    }

    .questions {
      display: grid;
      gap: 14px;
    }

    .question {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 10px 28px rgba(46, 75, 62, 0.08);
      scroll-margin-top: 18px;
    }

    .question-head {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 14px;
    }

    .badge {
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 8px;
      color: #17446f;
      background: var(--blue-soft);
      font-weight: 800;
    }

    .stem {
      margin: 0;
      font-size: 18px;
      line-height: 1.65;
      font-weight: 700;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .option {
      display: grid;
      grid-template-columns: 32px 1fr;
      gap: 10px;
      align-items: center;
      min-height: 56px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      text-align: left;
      cursor: pointer;
      transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
    }

    .option:hover {
      transform: translateY(-1px);
      border-color: var(--blue);
    }

    .letter {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      color: #17446f;
      background: var(--blue-soft);
      font-weight: 800;
    }

    .option.selected {
      border-color: var(--blue);
      background: var(--blue-soft);
    }

    .option.correct {
      border-color: var(--green);
      background: var(--green-soft);
    }

    .option.wrong {
      border-color: var(--red);
      background: var(--red-soft);
    }

    .explain {
      display: none;
      margin: 14px 0 0;
      padding: 12px 14px;
      border-radius: 8px;
      color: #315246;
      background: #f0f8f4;
      line-height: 1.65;
    }

    .explain.show {
      display: block;
    }

    .result {
      display: none;
      margin-bottom: 18px;
      padding: 18px;
      border: 1px solid #b9dcc9;
      border-radius: 8px;
      background: #f1fbf5;
      box-shadow: var(--shadow);
    }

    .result.show {
      display: block;
    }

    .result h2 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .result p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    @media (max-width: 860px) {
      .topbar,
      .layout {
        grid-template-columns: 1fr;
      }

      .side {
        position: static;
      }

      .question-map {
        grid-template-columns: repeat(10, 1fr);
      }
    }

    @media (max-width: 620px) {
      .app {
        width: min(100% - 20px, 1160px);
        padding-top: 18px;
      }

      .options {
        grid-template-columns: 1fr;
      }

      .question-map {
        grid-template-columns: repeat(5, 1fr);
      }

      .stem {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="topbar" aria-label="练习概览">
      <div>
        <h1>一年级奥数选择题</h1>
        <p class="subtitle">20 道题，覆盖数感、规律、排队、图形、简单推理。选择答案后可随时提交查看解析。</p>
      </div>
      <div class="score-card" aria-live="polite">
        <div class="score-label">已完成</div>
        <div class="score-number"><span id="answeredCount">0</span>/20</div>
        <div class="progress-track" aria-hidden="true">
          <div class="progress-bar" id="progressBar"></div>
        </div>
      </div>
    </section>

    <section class="result" id="resultBox" aria-live="polite">
      <h2 id="resultTitle">练习结果</h2>
      <p id="resultText"></p>
    </section>

    <section class="layout">
      <aside class="side" aria-label="答题导航">
        <h2>题目导航</h2>
        <div class="legend">
          <span><i class="dot"></i>未作答</span>
          <span><i class="dot answered"></i>已选择</span>
          <span><i class="dot correct"></i>提交后正确</span>
        </div>
        <div class="question-map" id="questionMap"></div>
        <div class="actions">
          <button class="primary" id="submitBtn" type="button">提交答案</button>
          <button class="secondary" id="resetBtn" type="button">重新练习</button>
        </div>
      </aside>

      <section class="questions" id="questions" aria-label="题目列表"></section>
    </section>
  </main>

  <script>
    const questions = [
      {
        stem: "小明有 8 个苹果，妈妈又给他 5 个。他吃掉 3 个后，还剩几个苹果？",
        options: ["10 个", "11 个", "13 个", "16 个"],
        answer: 0,
        explain: "先算 8 + 5 = 13，再算 13 - 3 = 10。"
      },
      {
        stem: "找规律：2、4、6、8、（ ）。括号里应填什么？",
        options: ["9", "10", "11", "12"],
        answer: 1,
        explain: "每次增加 2，所以 8 后面是 10。"
      },
      {
        stem: "排队时，小红前面有 4 人，后面有 6 人，这一队一共有多少人？",
        options: ["10 人", "11 人", "12 人", "9 人"],
        answer: 1,
        explain: "要把小红自己也算进去：4 + 1 + 6 = 11。"
      },
      {
        stem: "一个数比 9 大 4，这个数是多少？",
        options: ["5", "12", "13", "14"],
        answer: 2,
        explain: "比 9 大 4，就是 9 + 4 = 13。"
      },
      {
        stem: "盒子里有红球 6 个，蓝球 6 个，红球和蓝球一共有多少个？",
        options: ["10 个", "11 个", "12 个", "13 个"],
        answer: 2,
        explain: "6 + 6 = 12。"
      },
      {
        stem: "小猫从第 1 级台阶跳到第 5 级台阶，一共向上跳了几级？",
        options: ["3 级", "4 级", "5 级", "6 级"],
        answer: 1,
        explain: "从 1 到 5 是 1->2、2->3、3->4、4->5，共 4 级。"
      },
      {
        stem: "找规律：1、3、6、10、（ ）。括号里应填什么？",
        options: ["12", "14", "15", "16"],
        answer: 2,
        explain: "相邻两个数分别增加 2、3、4，下一次增加 5，10 + 5 = 15。"
      },
      {
        stem: "小华有 15 支铅笔，送给同学一些后还剩 9 支。他送出了几支？",
        options: ["5 支", "6 支", "7 支", "8 支"],
        answer: 1,
        explain: "送出的数量是 15 - 9 = 6。"
      },
      {
        stem: "一个正方形有几条边？",
        options: ["3 条", "4 条", "5 条", "6 条"],
        answer: 1,
        explain: "正方形有 4 条一样长的边。"
      },
      {
        stem: "小丽今年 7 岁，哥哥比她大 5 岁。哥哥今年几岁？",
        options: ["10 岁", "11 岁", "12 岁", "13 岁"],
        answer: 2,
        explain: "哥哥比小丽大 5 岁，所以 7 + 5 = 12。"
      },
      {
        stem: "3 个小朋友每人拿 2 颗糖，一共拿了几颗糖？",
        options: ["5 颗", "6 颗", "7 颗", "8 颗"],
        answer: 1,
        explain: "可以想成 2 + 2 + 2 = 6。"
      },
      {
        stem: "一根绳子剪 1 次，可以剪成 2 段；剪 3 次，可以剪成几段？",
        options: ["3 段", "4 段", "5 段", "6 段"],
        answer: 1,
        explain: "每剪 1 次多 1 段，剪 3 次就是 3 + 1 = 4 段。"
      },
      {
        stem: "找规律：20、18、16、14、（ ）。括号里应填什么？",
        options: ["13", "12", "11", "10"],
        answer: 1,
        explain: "每次减少 2，所以 14 后面是 12。"
      },
      {
        stem: "小强左手有 4 个弹珠，右手比左手多 3 个。右手有几个弹珠？",
        options: ["1 个", "6 个", "7 个", "8 个"],
        answer: 2,
        explain: "右手比左手多 3 个，就是 4 + 3 = 7。"
      },
      {
        stem: "钟面上，从 3 点到 5 点，经过了几个小时？",
        options: ["1 小时", "2 小时", "3 小时", "5 小时"],
        answer: 1,
        explain: "从 3 点到 4 点是 1 小时，从 4 点到 5 点又 1 小时，共 2 小时。"
      },
      {
        stem: "小朋友们站成一排，小东从左数第 3，从右数第 4。这一排一共有几人？",
        options: ["5 人", "6 人", "7 人", "8 人"],
        answer: 1,
        explain: "左右都数到了小东一次，所以总人数是 3 + 4 - 1 = 6。"
      },
      {
        stem: "一个盒子里原来有 10 块积木，拿走一些后剩 4 块。拿走了几块？",
        options: ["4 块", "5 块", "6 块", "7 块"],
        answer: 2,
        explain: "拿走的数量是 10 - 4 = 6。"
      },
      {
        stem: "找规律：1、2、4、8、（ ）。括号里应填什么？",
        options: ["10", "12", "14", "16"],
        answer: 3,
        explain: "每个数都是前一个数加上自己，也可以看成翻倍：8 后面是 16。"
      },
      {
        stem: "有 5 个盒子，每个盒子里放 1 个球，还剩 2 个球没放。原来一共有几个球？",
        options: ["5 个", "6 个", "7 个", "8 个"],
        answer: 2,
        explain: "盒子里放了 5 个球，再加上剩下的 2 个，一共 7 个。"
      },
      {
        stem: "小明、小红、小刚比身高。小明比小红高，小刚比小明高。谁最高？",
        options: ["小明", "小红", "小刚", "一样高"],
        answer: 2,
        explain: "小刚比小明高，小明又比小红高，所以小刚最高。"
      }
    ];

    const state = {
      selected: Array(questions.length).fill(null),
      submitted: false
    };

    const questionsEl = document.querySelector("#questions");
    const mapEl = document.querySelector("#questionMap");
    const answeredCountEl = document.querySelector("#answeredCount");
    const progressBarEl = document.querySelector("#progressBar");
    const submitBtn = document.querySelector("#submitBtn");
    const resetBtn = document.querySelector("#resetBtn");
    const resultBox = document.querySelector("#resultBox");
    const resultTitle = document.querySelector("#resultTitle");
    const resultText = document.querySelector("#resultText");

    function render() {
      questionsEl.innerHTML = questions.map((question, index) => {
        const options = question.options.map((option, optionIndex) => {
          const selected = state.selected[index] === optionIndex;
          const isCorrect = question.answer === optionIndex;
          const showCorrect = state.submitted && isCorrect;
          const showWrong = state.submitted && selected && !isCorrect;
          const classes = ["option"];
          if (selected) classes.push("selected");
          if (showCorrect) classes.push("correct");
          if (showWrong) classes.push("wrong");
          return `
            <button class="${classes.join(" ")}" type="button" data-question="${index}" data-option="${optionIndex}" aria-pressed="${selected}">
              <span class="letter">${String.fromCharCode(65 + optionIndex)}</span>
              <span>${option}</span>
            </button>
          `;
        }).join("");

        return `
          <article class="question" id="question-${index + 1}">
            <div class="question-head">
              <span class="badge">${index + 1}</span>
              <p class="stem">${question.stem}</p>
            </div>
            <div class="options">${options}</div>
            <p class="explain ${state.submitted ? "show" : ""}">${question.explain}</p>
          </article>
        `;
      }).join("");

      mapEl.innerHTML = questions.map((question, index) => {
        const answered = state.selected[index] !== null;
        const correct = state.submitted && state.selected[index] === question.answer;
        const wrong = state.submitted && answered && !correct;
        const classes = ["jump"];
        if (answered) classes.push("answered");
        if (correct) classes.push("correct");
        if (wrong) classes.push("wrong");
        return `<button class="${classes.join(" ")}" type="button" data-jump="${index + 1}" aria-label="跳到第 ${index + 1} 题">${index + 1}</button>`;
      }).join("");

      updateProgress();
    }

    function updateProgress() {
      const answered = state.selected.filter(Number.isInteger).length;
      answeredCountEl.textContent = answered;
      progressBarEl.style.width = `${answered / questions.length * 100}%`;
    }

    function showResult() {
      const answered = state.selected.filter(Number.isInteger).length;
      const correct = questions.reduce((sum, question, index) => {
        return sum + (state.selected[index] === question.answer ? 1 : 0);
      }, 0);
      const empty = questions.length - answered;
      resultBox.classList.add("show");
      resultTitle.textContent = `得分：${correct} / ${questions.length}`;
      resultText.textContent = empty > 0
        ? `还有 ${empty} 道题没有作答。绿色是正确答案，红色是你选错的答案。`
        : `全部题目已作答。绿色是正确答案，红色是你选错的答案。`;
      resultBox.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    questionsEl.addEventListener("click", (event) => {
      const button = event.target.closest("[data-question]");
      if (!button) return;
      const questionIndex = Number(button.dataset.question);
      const optionIndex = Number(button.dataset.option);
      state.selected[questionIndex] = optionIndex;
      if (state.submitted) {
        state.submitted = false;
        resultBox.classList.remove("show");
      }
      render();
      document.querySelector(`#question-${questionIndex + 1}`).scrollIntoView({ block: "nearest" });
    });

    mapEl.addEventListener("click", (event) => {
      const button = event.target.closest("[data-jump]");
      if (!button) return;
      document.querySelector(`#question-${button.dataset.jump}`).scrollIntoView({ behavior: "smooth", block: "start" });
    });

    submitBtn.addEventListener("click", () => {
      state.submitted = true;
      render();
      showResult();
    });

    resetBtn.addEventListener("click", () => {
      state.selected = Array(questions.length).fill(null);
      state.submitted = false;
      resultBox.classList.remove("show");
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    render();
  </script>
</body>
</html>
